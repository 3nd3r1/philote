component web/AuthorCard
key 92c6c56f3e69e866ba7eb2f8a80461a1fb809deee9e7a9a10f415e71f71bff60
model claude-opus-5-5
| const initials = author.name
|   .split(/\s+/)
|   .filter(Boolean)
|   .slice(0, 2)
|   .map((part) => part[0]?.toUpperCase() ?? "")
|   .join("");
|
| return (
|   <Card className="h-full rounded-xl transition-colors hover:bg-accent">
|     <CardHeader className="flex flex-row items-center gap-4">
|       <div
|         aria-hidden="true"
|         className="flex size-12 shrink-0 items-center justify-center rounded-full bg-secondary font-heading text-base font-semibold text-secondary-foreground"
|       >
|         {initials || <Icons.User className="size-5" />}
|       </div>
|       <div className="flex min-w-0 flex-col gap-1">
|         <CardTitle className="truncate font-heading text-lg leading-tight">
|           {author.name}
|         </CardTitle>
|         <CardDescription className="flex items-center gap-1.5 text-muted-foreground">
|           <Icons.Cake className="size-4 shrink-0" />
|           <span>
|             Born <time dateTime={author.born}>{formatDate(author.born)}</time>
|           </span>
|         </CardDescription>
|       </div>
|       <CardAction className="self-center text-muted-foreground">
|         <Icons.ChevronRight className="size-4" />
|       </CardAction>
|     </CardHeader>
|   </Card>
| );

component web/AuthorView
key 1547e831209b225dccd60814a9a11fd53eceeec2667c37f10e23468b7c59c776
model claude-opus-5-5
| const books = author.books;
|
| return (
|   <div className="mx-auto w-full max-w-[900px] px-4 py-8">
|     <Card className="rounded-xl">
|       <CardHeader>
|         <CardTitle className="font-heading text-3xl tracking-tight">
|           {author.name}
|         </CardTitle>
|         <CardDescription className="flex items-center gap-2 text-muted-foreground">
|           <Icons.Cake className="size-4" />
|           <span>Born {formatDate(author.born)}</span>
|         </CardDescription>
|         <CardAction>
|           <Badge variant="secondary" className="gap-1">
|             <Icons.BookOpen className="size-3.5" />
|             {books.length} {books.length === 1 ? "book" : "books"}
|           </Badge>
|         </CardAction>
|       </CardHeader>
|       <Separator />
|       <CardContent className="flex flex-col gap-4">
|         <h2 className="font-heading text-lg font-semibold text-card-foreground">
|           Books
|         </h2>
|         {books.length === 0 ? (
|           <p className="text-sm text-muted-foreground">No books.</p>
|         ) : (
|           <ul className="grid gap-2 sm:grid-cols-2">
