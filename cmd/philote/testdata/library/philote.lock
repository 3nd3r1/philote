|               >
|                 <Icons.Book className="size-4 shrink-0 text-muted-foreground" />
|                 <span className="text-sm font-medium text-foreground">
|                   {book.title}
|                 </span>
|               </li>
|             ))}
|           </ul>
|         )}
|       </CardContent>
|     </Card>
|   </div>
| );

component web/BookCard
