model claude-opus-5-5
| const matches = (all("Match") as Match[]).filter(
|   (m) => m.first_id === horse.id || m.second_id === horse.id
| );
| matches.sort((a, b) => {
|   const ta = Date.parse(a.matched_at);
|   const tb = Date.parse(b.matched_at);
|   if (tb !== ta) return tb - ta;
|   return b.id < a.id ? -1 : b.id > a.id ? 1 : 0;
| });
| return matches;

step api/match_if_mutual
key eebc3884666c0502c82943e8e185dc9dfc005f57c5584a23c487a31c437f3439
model claude-opus-5-5
| if (!swipe.liked) {
|   return null;
| }
|
| const swipes = all("Swipe") as Swipe[];
| const reciprocal = swipes.find(
|   (s) =>
|     s.liked &&
|     s.horse_id === swipe.target_id &&
|     s.target_id === swipe.horse_id
| );
|
| if (!reciprocal) {
|   return null;
| }
|
| const matches = all("Match") as Match[];
| const existing = matches.find(
|   (m) =>
|     (m.first_id === swipe.horse_id && m.second_id === swipe.target_id) ||
|     (m.first_id === swipe.target_id && m.second_id === swipe.horse_id)
| );
|
| if (existing) {
|   return existing;
| }
|
| const match = insert("Match", {
|   matched_at: new Date().toISOString(),
|   first_id: swipe.horse_id,
|   second_id: swipe.target_id,
| }) as Match;
|
| return match;

