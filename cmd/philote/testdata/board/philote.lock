|             <dt className="flex items-center gap-1.5 text-sm text-muted-foreground">
|               <Icons.CheckCheck className="size-4" />
|               Finished
|             </dt>
|             <dd className="text-sm font-medium text-card-foreground">
|               {formatDateTime(task.finished_at)}
