step api/finish_task
key 1fdb4d50e602dade7506bcf07bf678fc59f7ac4afffaf20e466f752fa6422ebd
model claude-opus-5-5
| const current = (find("Task", task.id) as Task | undefined) ?? task;
| if (current.status === "done") {
|   fail("already_done");
| }
| const updated = update("Task", task.id, {
|   status: "done",
|   finished_at: new Date().toISOString(),
| }) as Task | undefined;
| return updated ?? { ...current, status: "done", finished_at: new Date().toISOString() };

