step api/book_slot
key ed2493dddc21c85d2a9dd06416bfe5be1ba1f7fac0fb540c05ab499646f7fa75
model claude-opus-5-5
| const existing = (all("Booking") as Booking[]).find((b) => b.slot_id === slot.id);
| if (existing) {
|   fail("taken");
| }
| const now = new Date();
| if (new Date(slot.starts_at).getTime() <= now.getTime()) {
|   fail("started");
| }
| const row = insert("Booking", {
|   booked_at: now.toISOString(),
|   slot_id: slot.id,
|   client_id: client.id,
| });
| return row as Booking;

step api/find_bookings
key 9cb87e42e166cc0e7f69078369b7d0e808a2cab9667093cbd1b4e202e350342c
model claude-opus-5-5
| const now = Date.now();
| const results: { booking: Booking; startsAt: number }[] = [];
| for (const row of all("Booking")) {
|   const booking = row as Booking;
|   if (booking.client_id !== client.id) continue;
|   const slot = find("Slot", booking.slot_id) as Slot | undefined;
|   if (!slot) continue;
|   const startsAt = Date.parse(slot.starts_at);
|   if (Number.isNaN(startsAt) || startsAt < now) continue;
|   results.push({ booking, startsAt });
| }
| results.sort((a, b) => a.startsAt - b.startsAt);
| return results.map((r) => r.booking);

step api/find_open_slots
key 8ff78428b49edd131e23e60cc44e5efc8818491168967358ab9d2ebc5bcd55c1
model claude-opus-5-5
| const now = Date.now();
| const bookedSlotIds = new Set(
|   (all("Booking") as Booking[]).map((b) => b.slot_id)
| );
| return (all("Slot") as Slot[])
|   .filter((s) => {
|     const t = Date.parse(s.starts_at);
|     return !Number.isNaN(t) && t >= now && !bookedSlotIds.has(s.id);
|   })
|   .sort((a, b) => Date.parse(a.starts_at) - Date.parse(b.starts_at));

